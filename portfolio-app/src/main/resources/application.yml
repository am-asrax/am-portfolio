#mongo
MONGODB_URL: ${MONGODB_URL:mongodb://localhost:27017/portfolio}

#Kafka
KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
KAFKA_USERNAME: ${KAFKA_USERNAME:kafka}
KAFKA_PASSWORD: ${KAFKA_PASSWORD:password}

#Topic
PORTFOLIO_CONSUMER_ID: am-portfolio-group-1
PORTFOLIO_TOPIC: am-portfolio
STOCK_CONSUMER_ID: am-stock-group.v2
STOCK_TOPIC: am-stock-price-update
MARKET_INDEX_CONSUMER_ID: am-market-index-group-1
MARKET_INDEX_TOPIC: nse-stock-indices-update

#Redis
REDIS_HOSTNAME: ${REDIS_HOSTNAME:localhost}
REDIS_PORT: ${REDIS_PORT:6379}
REDIS_PASSWORD: ${REDIS_PASSWORD:}

spring:
  application:
    name: portfolio-app
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${PORTFOLIO_CONSUMER_ID}
      auto-offset-reset: latest
      enable-auto-commit: false
      max-poll-records: 100
    properties:
      security-protocol: SASL_PLAINTEXT
      sasl-mechanism: PLAIN
      sasl-jaas-config: org.apache.kafka.common.security.plain.PlainLoginModule
        required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";
      ssl-endpoint-identification-algorithm: ""
      ssl-truststore-location: /etc/ssl/certs/java/cacerts
      ssl-truststore-password: ${SSL_TRUSTSTORE_PASSWORD:changeit}
  data:
    redis:
      host: ${REDIS_HOSTNAME}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      portfolio-mover:
        ttl: 900 # 15 minutes in seconds
        key-prefix: "portfolio:analysis:"
      portfolio-summary:
        ttl: 900 # 15 minutes in seconds
        key-prefix: "portfolio:summary:"
      portfolio-holdings:
        ttl: 900 # 15 minutes in seconds
        key-prefix: "portfolio:holdings:"
      market-indices:
        ttl: 129600 # 30 Days in seconds
        key-prefix: "market-indices:indices:"
        historical:
          key-prefix: "market-indices:historical-indices:"
          ttl: 129600 # 30 Days in seconds
      stock:
        ttl: 129600 # 30 Days in seconds
        key-prefix: "stock:price:"
        historical:
          key-prefix: "stock:historical-price:"
          ttl: 129600 # 30 Days in seconds
      stock-indices:
        ttl: 129600 # 30 Days in seconds
        key-prefix: "stock-indices:data:"
        historical:
          key-prefix: "stock-indices:historical-data:"
          ttl: 129600 # 30 Days in seconds
    mongodb:
      uri: ${MONGODB_URL}
      database: ${MONGODB_DATABASE:portfolio}
      authentication-database: admin
  # Disable JDBC auto-configuration since we're using MongoDB
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

nse:
  broad-market-indices:
    - NIFTY 50
    - NIFTY NEXT 50
    - NIFTY MIDCAP 50
    - NIFTY MIDCAP 100
    - NIFTY MIDCAP 150
    - NIFTY MIDCAP 250
    - NIFTY MIDCAP 500
    - NIFTY SMLCAP 100
    - NIFTY SMLCAP 250
    - NIFTY SMLCAP 500
  sector-indices:
    - NIFTY BANK
    - NIFTY IT
    - NIFTY PHARMA
    - NIFTY AUTO
    - NIFTY METAL
    - NIFTY ENERGY
    - NIFTY FMCG
    - NIFTY MEDIA
    - NIFTY REALTY
    - NIFTY PSU BANK

app:
  jwt:
    secret: ${JWT_SECRET_KEY:"dummy-secret-for-local-testing"}
  kafka:
    portfolio:
      consumer:
        id: ${PORTFOLIO_CONSUMER_ID}
        enabled: true
      topic: ${PORTFOLIO_TOPIC}
    stock:
      consumer:
        id: ${STOCK_CONSUMER_ID}
        enabled: true
      topic: ${STOCK_TOPIC}
    market-index:
      consumer:
        id: ${MARKET_INDEX_CONSUMER_ID}
        enabled: true
      topic: ${MARKET_INDEX_TOPIC}

server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    max-threads: 20
    min-spare-threads: 10
    max-connections: 200

market-data:
  api:
    base-url: ${MARKET_DATA_SERVICE_URL:http://localhost:8020}

# OpenAPI Documentation
# JWT Secret for local testing


springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    "[com.portfolio]": DEBUG
    "[com.portfolio.analytics]": DEBUG
    "[com.portfolio.api]": DEBUG
    "[com.portfolio.marketdata]": DEBUG
    "[com.portfolio.model]": DEBUG
    "[com.am.common]": DEBUG
    "[com.am.common.amcommondata]": DEBUG
    org.springframework.kafka: INFO

management:
  endpoints:
    web:
      base-path: "/"
  endpoint:
    health:
      show-details: always

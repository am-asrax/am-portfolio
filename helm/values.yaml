# Base Environment Configuration
environment: dev

nameOverride: "am-portfolio"
fullnameOverride: "am-portfolio"

image:
  repository: am-portfolio
  tag: latest
  pullPolicy: IfNotPresent

global:
  image:
    imagePullSecrets:
      - name: "ghcr-secret"
  vault:
    serviceAccountName: "am-backend-sa"

security:
  automountServiceAccountToken: true

config:
  marketData:
    maxRetries: 3
    retryDelayMs: 1000
    threadPoolSize: 5
    threadQueueCapacity: 10
    maxAgeMinutes: 15

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false

resources:
  limits:
    cpu: 500m
    memory: 1024Mi
  requests:
    cpu: 250m
    memory: 512Mi

vault:
  enabled: true
  secretPaths:
    infra: "kv/data/dev/infra"
    mongo: "kv/data/dev/apps/portfolio/database/mongo"
    redis: "kv/data/dev/apps/portfolio/database/redis"
    postgres: "kv/data/dev/apps/portfolio/database/postgres"
    influx: "kv/data/dev/apps/portfolio/database/influxdb"
    kafka: "kv/data/dev/apps/portfolio/kafka"
    upstox: "kv/data/dev/apps/portfolio/api/upstock"
    zerodha: "kv/data/dev/apps/portfolio/api/zerodha"
    app: "kv/data/dev/apps/portfolio"

monitoring:
  enabled: true
  prometheus:
    scrape: true
    port: "8080"
    path: "/prometheus"


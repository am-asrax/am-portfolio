# Development Environment Configuration
environment: dev

# Application Configuration
config:
  marketData:
    maxRetries: 3
    retryDelayMs: 1000
    threadPoolSize: 5
    threadQueueCapacity: 10
    maxAgeMinutes: 15

image:
  repository: ghcr.io/am-portfolio/am-portfolio
  tag: dev
  pullPolicy: Always

nameOverride: "am-portfolio"
fullnameOverride: "am-portfolio"

deployment:
  version: dev

# Service Configuration
service:
  type: ClusterIP
  port: 8060

# Ingress Configuration
ingress:
  enabled: true
  ipAddress: 20.59.109.241

# Resource Configuration
resources:
  limits:
    cpu: 250m
    memory: 512Mi
  requests:
    cpu: 125m
    memory: 256Mi

postgresql:
  enabled: true
  fullname: host.docker.internal
  auth:
    database: portfolio
    username: postgres
    password: password
  primary:
    service:
      port: 5456

# Vault Configuration
vault:
  enabled: true
  secretPaths:
    database: "vault:kv/data/dev/database"
    api: "vault:kv/data/dev/api"
    basepath: "vault:kv/data/dev"

# Monitoring Configuration
monitoring:
  enabled: true
  prometheus:
    scrape: true
    port: "8060"
    path: "/actuator/prometheus"

# Trigger pipeline test comment 2 - testing parallel deploy change


# Development Environment Configuration
environment: dev

# Application Configuration
config:
  marketData:
    maxRetries: 3
    retryDelayMs: 1000
    threadPoolSize: 5
    threadQueueCapacity: 10
    maxAgeMinutes: 15

image:
  repository: am-portfolio
  tag: dev
  pullPolicy: Always

global:
  image:
    imagePullSecrets:
      - name: "ghcr-secret"
  vault:
    serviceAccountName: "am-backend-sa"

security:
  automountServiceAccountToken: true

nameOverride: "am-portfolio"
fullnameOverride: "am-portfolio"

deployment:
  version: dev

# Service Configuration
service:
  type: ClusterIP
  port: 8080

# Ingress Configuration
ingress:
  enabled: true
  ipAddress: 20.59.109.241

# Resource Configuration
resources:
  limits:
    cpu: 250m
    memory: 512Mi
  requests:
    cpu: 125m
    memory: 256Mi

postgresql:
  enabled: true
  fullname: host.docker.internal
  auth:
    database: portfolio
    username: postgres
    password: ""
  primary:
    service:
      port: 5452

# Vault Configuration
vault:
  enabled: true
  secretPaths:
    infra: "kv/data/dev/infra"
    mongo: "kv/data/dev/apps/portfolio/database/mongo"
    redis: "kv/data/dev/apps/portfolio/database/redis"
    postgres: "kv/data/dev/apps/portfolio/database/postgres"
    influx: "kv/data/dev/apps/portfolio/database/influxdb"
    kafka: "kv/data/dev/apps/portfolio/kafka"
    upstox: "kv/data/dev/apps/portfolio/api/upstock"
    zerodha: "kv/data/dev/apps/portfolio/api/zerodha"
    app: "kv/data/dev/apps/portfolio"


# Monitoring Configuration
monitoring:
  enabled: true
  prometheus:
    scrape: true
    port: "8060"
    path: "/actuator/prometheus"

# Trigger pipeline test comment 2 - testing parallel deploy change


name: AM Portfolio Publish

on:
  push:
    branches: ["main", "develop", "test/**", "feature/**"]
    paths:
      - 'portfolio-service/**'
      - 'portfolio-api/**'
      - 'portfolio-app/**'
      - 'portfolio-analytics/**'
      - 'portfolio-market-data/**'
      - 'portfolio-model/**'
      - 'portfolio-kafka/**'
      - 'portfolio-redis/**'
      - 'helm/**'
      - 'pom.xml'
      - 'scripts/**'
      - '.github/workflows/**'

  pull_request:
    branches: ["main", "develop", "test/**", "feature/**"]
    paths:
      - 'portfolio-service/**'
      - 'portfolio-api/**'
      - 'helm/**'
      - 'pom.xml'
      - 'scripts/**'
      - '.github/workflows/**'

  workflow_dispatch:

jobs:
  setup:
    name: Vault Sync & Setup
    runs-on: self-hosted
    outputs:
      env_keys: ${{ steps.sync.outputs.env_keys }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync Secrets from Vault
        id: sync
        run: |

          npm install --no-audit --no-fund --quiet
          npm run sync:secrets

          # Exporting secrets to GITHUB_ENV or as outputs if needed by the reusable workflow
          # However, 'secrets: inherit' usually handles it if the keys are in GH Secrets.
          # Here we are using Vault as the source.

  publish:
    name: Publish AM Portfolio
    needs: setup
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: AM-Portfolio/am-pipelines/.github/workflows/central-build-publish.yml@develop
    with:
      language: 'java'
      working_directory: '.' 
      image_name: 'am-portfolio'
      build_context: '.'
      dev_namespace: 'dev'
      preprod_namespace: 'preprod'
      prod_namespace: 'prod'            
      deploy_dev: true
      deploy_prod: true
    secrets: inherit
